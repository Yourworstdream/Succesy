name: Finanzkompass

# Prüft Syntax und Rechenkern der Finanz-App, sobald sich etwas in finanzkompass/ ändert.
on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ "finanzkompass/**", ".github/workflows/finanzkompass.yml" ]
  pull_request:
    paths: [ "finanzkompass/**", ".github/workflows/finanzkompass.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax prüfen
        run: for f in finanzkompass/assets/*.js; do node --check "$f"; done

      - name: Rechenkern testen
        run: node --test finanzkompass/tests/logik.test.js
