name: Release veröffentlichen

# Ein Git-Tag wie "v1.2.0" erzeugt automatisch ein GitHub-Release mit der fertigen EXE.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Testen
        run: dotnet test Laternenwacht.sln -c Release

      - name: Als einzelne EXE veröffentlichen (Version aus dem Tag)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish frontend/Laternenwacht.App/Laternenwacht.App.csproj -p:PublishProfile=Win-x64-EinzelneExe -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ziel = "Laternenwacht-${{ github.ref_name }}-win-x64.exe"
          Move-Item publish/win-x64/Laternenwacht.exe $ziel
          (Get-FileHash $ziel -Algorithm SHA256).Hash.ToLower() + "  $ziel" | Out-File "$ziel.sha256" -Encoding ascii

      - name: GitHub-Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ziel = "Laternenwacht-${{ github.ref_name }}-win-x64.exe"
          gh release create "${{ github.ref_name }}" $ziel "$ziel.sha256" `
            --title "Laternenwacht ${{ github.ref_name }}" `
            --generate-notes
